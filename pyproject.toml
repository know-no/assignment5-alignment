[project]
name = "alignment"
version = "1.0.0"
description = "CS 336 Spring 2025 Assignment 5: Alignment"
readme = "README.md"
requires-python = ">=3.11,<3.13"  # Python 3.13 not yet supported for some deps
dependencies = [
    "accelerate>=1.5.2",
    "alpaca-eval",
    "jupyter>=1.1.1",
    "math-verify[antlr4-13-2]>=0.7.0",
    "pylatexenc==2.10",
    "notebook>=7.4.2",
    "pytest>=8.3.5",
    "torch",
    "tqdm>=4.67.1",
    "transformers>=4.50.0",
    "typer>=0.15.4",
    "wandb>=0.19.8",
    "xopen>=2.0.2",
    "datasets>=2.14.4",
]

[project.optional-dependencies]
gpu = [
    "flash-attn==2.7.4.post1",
    "vllm==0.7.2",
]

[tool.setuptools.packages.find]
include = ["cs336_alignment"]

[tool.uv]
package = true
no-build-isolation-package = ["flash-attn"]


[tool.uv.sources]
alpaca-eval = { git = "https://github.com/nelson-liu/alpaca_eval.git", rev = "forward_kwargs_to_vllm" }

#跳过目录
# uv run pytest tests/ -k test_tokenize_prompt_and_output
# uv run pytest -k test_tokenize_prompt_and_output --ignore=env_tests
#给那些文件加 pytest.importorskip（如果你想保留它们偶尔跑）
#在 env_tests/test_vllm_*.py 顶部：
#import pytest
#vllm = pytest.importorskip("vllm")
#这样没装 vllm 时整个文件被自动 skip，不算 collection 错误。

[tool.pytest.ini_options]
testpaths = ["tests"]          # 只收集 tests 目录
# 或者
norecursedirs = ["env_tests"]  # 跳过 env_tests
log_cli = true
log_cli_level = "WARNING"

[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.7.4.post1"
requires-dist = ["torch", "einops", "setuptools"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
